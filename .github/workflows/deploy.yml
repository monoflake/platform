# Builds the images and the Workers a push changed and leaves them as artifacts of this run. Nothing
# is published and nothing here reaches a machine or Cloudflare: when the run ends, GitHub's webhook
# tells the nodes and the deployer, and each fetches and checks what was built. See infra's
# spec/architecture/host.md and spec/architecture/deployer.md.
name: Deploy

on:
  push:
    branches: [main]
  # The first of each month rebuilds geo, whose image fetches GeoNames as it is built.
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build, space-separated; empty for every one"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      workers: ${{ steps.plan.outputs.workers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          ASKED: ${{ inputs.apps }}
        run: |
          if [ "$EVENT" = schedule ]; then
            apps='["geo"]'
            workers='[]'
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$ASKED" ]; then
            apps="$(printf '%s\n' $ASKED | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))')"
            # The asked apps that are Workers; an image-only name asks for no Worker.
            workers="$(.mise/tasks/deployable --workers --all | python3 -c 'import json,os,sys; asked=os.environ["ASKED"].split(); print(json.dumps([w for w in json.load(sys.stdin) if w in asked]))')"
          elif [ "$EVENT" = workflow_dispatch ] || [ -z "${BEFORE//0/}" ]; then
            apps="$(.mise/tasks/deployable --all)"
            workers="$(.mise/tasks/deployable --workers --all)"
          else
            apps="$(.mise/tasks/deployable --git "$BEFORE")"
            workers="$(.mise/tasks/deployable --workers --git "$BEFORE")"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "building: $apps"
          echo "packaging: $workers"

  # Every declaration the run builds an image for, apart and small, so a node reads where an app
  # is placed, and in which architecture, before it downloads any image. See infra's
  # spec/architecture/host.md, "The machine pulls; nothing pushes into it".
  declare:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - env:
          APPS: ${{ needs.plan.outputs.apps }}
        run: |
          mkdir -p "$RUNNER_TEMP/declarations"
          for app in $(printf '%s' "$APPS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            cp apps/*/"$app"/service.toml "$RUNNER_TEMP/declarations/$app.toml"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: declarations
          path: ${{ runner.temp }}/declarations/
          retention-days: 7
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
        arch: [arm64, amd64]
        # Each arch builds natively on its own runner; the include entries only attach the runner.
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      # The workspace above the project, as it is checked out at home: its rust-toolchain.toml is
      # the compiler every image is built with.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/platform
      # The runner's default builder cannot export an image as an archive; a container builder can.
      - uses: docker/setup-buildx-action@v4
      # The runtime's cache credentials, for sccache, which only an action is handed; see infra's
      # spec/architecture/host.md, "An image is built for speed, and for any node of its
      # architecture".
      - uses: crazy-max/ghaction-github-runtime@v4
      - env:
          APP: ${{ matrix.app }}
          PLATFORM: linux/${{ matrix.arch }}
          SCCACHE_GHA_ENABLED: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          repos/platform/.mise/tasks/image "$APP" "$RUNNER_TEMP/deploy/image.tar"
          cp repos/platform/apps/*/"$APP"/service.toml "$RUNNER_TEMP/deploy/"
      # The image layers are compressed already; the node needs it for as long as a deploy takes.
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/deploy/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # A Worker is one artifact for every architecture: wrangler's bundle, its assets, its declaration
  # and its resolved config, packaged without a credential. Nothing deploys it here; until a Worker
  # is moved onto the deployer, Cloudflare's Git integration still does. See
  # spec/architecture/deployer.md, "What a Worker artifact is".
  worker:
    needs: plan
    if: needs.plan.outputs.workers != '[]'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.workers) }}
    steps:
      # The workspace above the project, as for an image: its mise.toml pins the Node it builds on.
      - uses: actions/checkout@v7
        with:
          repository: canmi21/canmi
      - uses: actions/checkout@v7
        with:
          path: repos/platform
      - id: node
        run: echo "version=$(sed -n 's/^node = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      - working-directory: repos/platform
        env:
          APP: ${{ matrix.app }}
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          app="$(find apps -mindepth 2 -maxdepth 2 -type d -name "$APP" | head -n 1)"
          pnpm install --frozen-lockfile --filter "{./$app}..."
          .mise/tasks/worker "$APP" "$RUNNER_TEMP/worker"
      # Hidden files included: SvelteKit's `.assetsignore` keeps its Worker out of the assets.
      - uses: actions/upload-artifact@v7
        with:
          name: worker-${{ matrix.app }}
          path: ${{ runner.temp }}/worker/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
