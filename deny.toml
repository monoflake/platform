# What a crate may depend on, RFC fhg6w: `cargo deny check`, run by verify. A dependency is under a
# license every component's own allows it to be linked into, so the permissive half stays
# permissive.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	# minicbor's, RFC fhg6w: permissive, OSI approved, read 2026-10-19 in docs/lessons/languages.md.
	"BlueOak-1.0.0",
	"CC0-1.0",
	"ISC",
	"MIT",
	"Unicode-3.0",
	"Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
