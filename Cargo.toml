# The Rust half of the tree, RFC fhg6w: a virtual manifest, every crate beneath code/ a member,
# listed one by one since cargo takes no recursive glob, and held to what is there by the check.
[workspace]
resolver = "3"
members = ["code/libs/codec"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
minicbor = { version = "2", features = ["alloc", "derive"] }

# Every crate takes these by `[lints] workspace = true`, held by model/checks/layout/workspace.res.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
dbg_macro = "deny"
