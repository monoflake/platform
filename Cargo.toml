[workspace]
resolver = "3"

# Listed explicitly rather than globbed: Cargo errors on any matched directory without a
# Cargo.toml, so a glob over `apps/*` would break every cargo command the moment a
# TypeScript-only directory appeared there.
members = [
	"apps/system/apk",
	"apps/system/apt",
	"apps/system/cron",
	"apps/system/relay",
	"apps/compute/geo",
	"apps/model/grok",
	"apps/data/ledger",
	"apps/observe/probe",
	"apps/compute/shot",
	"apps/observe/telemetry",
	"libs/ledger",
	"libs/packages",
	"libs/sdk",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# `style` is left at clippy's default, a warning; see the workspace's spec/lint-format.md.
correctness = "deny"
suspicious = "deny"
complexity = "warn"

# Our own crates at 0 so an edit-build cycle stays short, dependencies at 3, built once and
# cached, so a dev run is not slowed by code nobody here is changing. Not "z": a server pays for
# speed on every request and for size never.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# What an image ships, and nothing else builds with it. Speed rather than size, since a server's
# binary is paid for on every request and its bytes never; no debugger reads what it would carry.
# No target-cpu, so an image runs on any node of its architecture. See infra's
# spec/architecture/host.md.
[profile.container]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
