# The Rust half of the tree, RFC fhg6w: a virtual manifest, every crate beneath code/ a member, listed
# one by one since cargo takes no recursive glob, and held to what is there by the check.
[workspace]
resolver = "3"
members = []

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
minicbor = { version = "2", features = ["alloc", "derive"] }
