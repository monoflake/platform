# This repository's own tasks; its tools are the workspace's, read by walking up.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
cargo-deny = "0.20"

# What oxfmt formats here; ReScript's formatter takes its sources from rescript.json.
[vars]
formatted = "'*.md' '*.json' 'docs/**/*.md' 'model/*.json' 'tests/**/*.json'"

[tasks.fmt]
description = "Format the model with ReScript's formatter and the prose, the product and the samples with oxfmt: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List what is not formatted and write nothing"'
run = """
if [ -z "${usage_dry_run:-}" ]; then rescript format && oxfmt {{vars.formatted}}; exit; fi
rescript format --check; oxfmt --list-different {{vars.formatted}}; exit 0
"""

[tasks.formatted]
description = "Fail where anything is not formatted, as verify asks"
run = "rescript format --check && oxfmt --check {{vars.formatted}}"

[tasks.check]
description = "Compile the model and run its check: `check [--ready[=N]] [--s1] [--write]`"
run = "rescript build && node model/check.res.mjs"

[tasks.brief]
description = "Print one block's brief, read from the model: `brief <package> [--path]`"
usage = '''
arg "<package>" help="The block, by its package name"
flag "--path" help="Its directory alone"
'''
run = 'rescript build > /dev/null && node model/brief.res.mjs "$usage_package" ${usage_path:+--path}'

[tasks.accept]
description = "Hold one block to its brief, alone, the model compiled before: `accept <package> [--from <revision>]`"
usage = '''
arg "<package>" help="The block, by its package name"
flag "--from <revision>" help="The revision its work began at"
'''
run = 'node model/accept.res.mjs "$usage_package" ${usage_from:+--from "$usage_from"} && mise run built "$usage_package"'

[tasks.prepare]
description = "Make a clone ready to build: the packages installed, the model compiled, every generated library written"
run = "pnpm install && rescript build && mise run generate"

[tasks.generate]
description = "Write again the ReScript a tool writes of a library, or of one: `generate [<package>]`"
usage = 'arg "[package]" help="The library, by its package name"'
run = 'node model/generate.res.mjs ${usage_package:-}'

[tasks.built]
description = "Build, format, lint and test one block alone, as accept and verify each ask: `built <package>`"
usage = 'arg "<package>" help="The block, by its package name"'
run = """
d=$(node model/brief.res.mjs "$usage_package" --path) && p="$usage_package" || exit 1
[ ! -f "$d/Cargo.toml" ] || { cargo fmt --check -p "$p" && cargo clippy -p "$p" --all-targets -- -D warnings && cargo test -p "$p"; } || exit 1
[ ! -f "$d/rescript.json" ] || { mise run generate "$p" && rescript build "$d" && cd "$d" && rescript format --check && node --test 'tests/**/*.mjs'; } || exit 1
[ ! -f "$d/docker-bake.hcl" ] || (cd "$d" && docker buildx bake --print > /dev/null)
"""

[tasks.blocks]
description = "Build, format, lint and test every written block alone; one in work fails nothing"
run = "rescript build > /dev/null && node model/built.res.mjs"

# What a user runs to deploy an app of their own, from wherever it lives, RFC n0o4l.
[tasks.deploy]
description = "Build an app's Worker with wrangler and deploy it to a test machine through its driver or a control: `deploy <directory> <target> [--app <id>] [--binding <id>] [--secrets <A,B>] [--network <http,tcp>] [--ingress <domain:name|mount:scope|binding>]... [--dry-run]`"
usage = '''
arg "<directory>" help="The app's directory, its wrangler configuration and its packages installed"
arg "<target>" help="The machine as ssh reaches it, root@machine.example, or local for monoflake/machine's local machine; or control:<origin>, a control, its operator's secret in CONTROL_OPERATOR"
flag "--app <id>" help="The app's id in 8 lowercase hex digits, to deploy it again; a new app, its id drawn and printed, unless given"
flag "--binding <id>" help="The binding a control deploys the app onto, its id in 8 lowercase hex digits, asked with a control: target"
flag "--secrets <names>" help="The secrets a control hands the driver, by name, each its environment variable's value"
flag "--network <kinds>" help="The network a control lets the app reach, http, tcp, udp or icmp, by commas"
flag "--ingress <declaration>" var=#true help="Repeat for each domain:<name>, mount:<scope> or binding; refused when metadata.json declares ingress"
flag "-n --dry-run" help="Build, pack and ask the machine or the control, and copy or send nothing"
'''
run = '''
#!/usr/bin/env bash
rescript build code/tools/deploy > /dev/null || exit 1
args=(); eval "ingress=(${usage_ingress:-})"
for value in "${ingress[@]}"; do args+=(--ingress "$value"); done
node code/tools/deploy/src/main.res.mjs "$usage_directory" "$usage_target" ${usage_app:+--app "$usage_app"} ${usage_binding:+--binding "$usage_binding"} ${usage_secrets:+--secrets "$usage_secrets"} ${usage_network:+--network "$usage_network"} "${args[@]}" ${usage_dry_run:+--dry-run}
'''

# An app a control drew an id for and that never ran, removed through releases' forget.
[tasks.forget]
description = "Remove an app whose id a control drew and that never ran, through the control's releases.forget: `forget <target> --app <id> [--dry-run]`"
usage = '''
arg "<target>" help="control:<origin>, the control holding the app, its operator's secret in CONTROL_OPERATOR"
flag "--app <id>" help="The app's id in 8 lowercase hex digits" required=#true
flag "-n --dry-run" help="Ask the control nothing and say what would be forgotten"
'''
run = 'rescript build code/tools/deploy > /dev/null && node code/tools/deploy/src/main.res.mjs "$usage_target" --forget "$usage_app" ${usage_dry_run:+--dry-run}'

# An app that ran removed through releases' retire, its driver asked to stop and delete it first.
[tasks.retire]
description = "Remove an app that ran, its deployment stopped and deleted by its binding's driver, through the control's releases.retire: `retire <target> --app <id> [--dry-run]`"
usage = '''
arg "<target>" help="control:<origin>, the control holding the app, its operator's secret in CONTROL_OPERATOR"
flag "--app <id>" help="The app's id in 8 lowercase hex digits" required=#true
flag "-n --dry-run" help="Ask the control nothing and say what would be retired"
'''
run = 'rescript build code/tools/deploy > /dev/null && node code/tools/deploy/src/main.res.mjs "$usage_target" --retire "$usage_app" ${usage_dry_run:+--dry-run}'

# The samples sent to what a test machine runs, RFC n0o4l.
[tasks.conform]
description = "Run the kinds' samples against the driver a test machine runs, on a second driver beside it, and report: `conform <target> --app <id> [--control <origin>] [--dry-run]`"
usage = '''
arg "<target>" help="The machine as ssh reaches it, root@machine.example, or local for monoflake/machine's local machine"
flag "--app <id>" help="Hello's id in 8 lowercase hex digits, as its deploy printed it" required=#true
flag "--control <origin>" help="A control whose gateway hello is asked through, at /v1/<id>/, in place of the machine's tunnel"
flag "-n --dry-run" help="Ask the machine and the live driver, and start nothing"
'''
run = 'rescript build code/tools/runner > /dev/null && rescript build code/tools/conform > /dev/null && node code/tools/conform/src/main.res.mjs "$usage_target" --app "$usage_app" ${usage_control:+--control "$usage_control"} ${usage_dry_run:+--dry-run}'

# The control plane lost on a test machine while hello is asked, RFC rmll5.
[tasks.lose]
description = "Stop a test machine's driver while hello is asked through its entry and tunnel, start it again and report: `lose <target> --app <id> [--control <origin>] [--dry-run]`"
usage = '''
arg "<target>" help="The machine as ssh reaches it, root@machine.example, or local for monoflake/machine's local machine"
flag "--app <id>" help="Hello's id in 8 lowercase hex digits, as its deploy printed it" required=#true
flag "--control <origin>" help="A control whose gateway hello is asked through, at /v1/<id>/, in place of the machine's tunnel"
flag "-n --dry-run" help="Ask the machine, the entry and the tunnel, and stop nothing"
'''
run = 'rescript build code/tools/lose > /dev/null && node code/tools/lose/src/main.res.mjs "$usage_target" --app "$usage_app" ${usage_control:+--control "$usage_control"} ${usage_dry_run:+--dry-run}'

# The driver and the entry replaced on a test machine while hello is asked, RFC ehm48.
[tasks.replace]
description = "Restart a test machine's driver, entry and containerd and copy a new build in while hello is asked through its entry and tunnel, and report: `replace <target> --app <id> [--control <origin>] [--no-build | --during <command>] [--dry-run]`"
usage = '''
arg "<target>" help="The machine as ssh reaches it, root@machine.example, or local for monoflake/machine's local machine"
flag "--no-build" help="Restart the units alone, and build and copy nothing"
flag "--during <command>" help="Run this command here as the one action under load, in place of every other"
flag "--app <id>" help="Hello's id in 8 lowercase hex digits, as its deploy printed it" required=#true
flag "--control <origin>" help="A control whose gateway hello is asked through, at /v1/<id>/, in place of the machine's tunnel"
flag "-n --dry-run" help="Ask the machine, the entry and the tunnel, and replace nothing"
'''
run = 'rescript build code/tools/replace > /dev/null && node code/tools/replace/src/main.res.mjs "$usage_target" --app "$usage_app" ${usage_control:+--control "$usage_control"} ${usage_no_build:+--no-build} ${usage_during:+--during "$usage_during"} ${usage_dry_run:+--dry-run}'

[tasks.clean]
description = "Remove what cargo, ReScript and the generator built, never an installed dependency or local state: `clean [--dry-run]`"
usage = '''
flag "-n --dry-run" help="List what would go and remove nothing"
'''
depends = ["//:build"]
run = "node {{env.WORKSPACE}}/scripts/clean.res.mjs code/libs/envelope/generated"

[tasks.verify]
description = "What a commit has to pass: everything formatted, the check, the model's tests, every block alone, and the crates' dependencies once there are crates"
run = [
	"mise run formatted",
	"mise run check",
	"node --test 'model/tests/**/*_test.res.mjs'",
	"mise run blocks",
	"grep -q '^members = \\[\\]' Cargo.toml || cargo deny check",
]
