# This repository's own tasks; its tools are the workspace's, read by walking up.
[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
cargo-deny = "0.20"

# What oxfmt formats here; ReScript's formatter takes its sources from rescript.json.
[vars]
formatted = "'*.md' '*.json' 'docs/**/*.md' 'model/*.json' 'tests/**/*.json'"

[tasks.fmt]
description = "Format the model with ReScript's formatter and the prose, the product and the samples with oxfmt: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List what is not formatted and write nothing"'
run = """
if [ -z "${usage_dry_run:-}" ]; then rescript format && oxfmt {{vars.formatted}}; exit; fi
rescript format --check; oxfmt --list-different {{vars.formatted}}; exit 0
"""

[tasks.formatted]
description = "Fail where anything is not formatted, as verify asks"
run = "rescript format --check && oxfmt --check {{vars.formatted}}"

[tasks.check]
description = "Compile the model and run its check: `check [--ready[=N]] [--s1] [--write]`"
run = "rescript build && node model/check.res.mjs"

[tasks.brief]
description = "Print one block's brief, read from the model: `brief <package> [--path]`"
usage = '''
arg "<package>" help="The block, by its package name"
flag "--path" help="Its directory alone"
'''
run = 'rescript build > /dev/null && node model/brief.res.mjs "$usage_package" ${usage_path:+--path}'

[tasks.accept]
description = "Hold one block to its brief, alone: `accept <package> [--from <revision>]`"
usage = '''
arg "<package>" help="The block, by its package name"
flag "--from <revision>" help="The revision its work began at"
'''
run = """
rescript build && node model/accept.res.mjs "$usage_package" ${usage_from:+--from "$usage_from"} || exit 1
d=$(node model/brief.res.mjs "$usage_package" --path) && p="$usage_package"
[ ! -f "$d/Cargo.toml" ] || { cargo fmt --check -p "$p" && cargo clippy -p "$p" --all-targets -- -D warnings && cargo test -p "$p"; } || exit 1
[ ! -f "$d/rescript.json" ] || { cd "$d" && rescript format --check && node --test 'tests/**/*.mjs'; }
"""

[tasks.verify]
description = "What a commit has to pass: everything formatted, the check, and the crates' dependencies once there are crates"
run = [
	"mise run formatted",
	"mise run check",
	"grep -q '^members = \\[\\]' Cargo.toml || cargo deny check",
]
