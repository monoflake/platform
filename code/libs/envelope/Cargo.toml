[package]
name = "envelope"
version = "0.0.0"
description = "The contracts' types, their JSON and CBOR and each interface's operations, written from model/contracts.json, RFC fhg6w"
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
codec = { path = "../codec" }
# A number is read exactly, as JavaScript reads it, so an integer written as a float keeps its value.
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
envelope-generator = { path = "../../tools/envelope-generator" }
