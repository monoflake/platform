[package]
name = "driver-machine-container"
version = "0.0.0"
description = "driver(machine)'s container: an image deployed as a container by containerd, RFC vr5lw"
edition.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
envelope = { path = "../../../../libs/envelope" }
chacha20poly1305 = "0.11"
containerd-client = "0.9"
prost-types = "0.14"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
