[package]
name = "packages"
version = "0.0.0"
description = "One interface to a node's package manager, behind a driver per agent."
keywords = ["packages", "updates", "agent"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
jiff = { version = "0.2", features = ["serde"] }
ledger = { path = "../ledger" }
response = { version = "2.0.0", features = ["axum"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.2", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
