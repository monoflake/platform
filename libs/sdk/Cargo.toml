[package]
name = "monoflake"
version = "0.0.0"
description = "The platform's addresses, for Rust."
keywords = ["monoflake", "urls"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The Rust half of @monoflake/sdk: `src/lib.rs` is generated from `src/index.ts` by `mise run
# urls`, so every Rust program reads the one URL map. See the workspace's
# spec/architecture/layers.md.
[lib]
path = "src/lib.rs"
