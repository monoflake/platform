# Globs are safe here: pnpm only picks up directories that contain a package.json and
# ignores the rest, so Rust-only libraries under libs/ are simply invisible to it. Cargo
# has no such tolerance, which is why Cargo.toml lists its members by hand instead.
packages:
  - apps/*/*
  - libs/*

# An install script runs arbitrary code before anybody reads the package, which is why pnpm
# blocks it. These are allowed because they cannot work otherwise: each unpacks a
# platform-specific native binary. Nothing goes in this list to make a warning go away.
allowBuilds:
  # Its postinstall only prints a funding message; the runtime modules need no build step.
  core-js: false
  esbuild: true
  protobufjs: true
  workerd: true

# Supply-chain delay, in minutes: a version waits 24 hours before it can be installed, here and
# transitively. The rule is the workspace's, in its toolchain.md -- a path across that boundary
# resolves only while this project is nested, so it is named rather than linked.
minimumReleaseAge: 1440

# Exempt only where waiting a day costs more than it protects: toolchain and type packages, read
# at build time and not shipped, and the author's own. Keep it short -- every entry is an
# accepted risk.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - '@types/node'
  - vite
  - wrangler
  - '@cloudflare/unenv-preset@2.16.2'
  - miniflare@5.20260921.0-alpha
  # The author's own scopes, published from their own repositories by the author alone: a day's
  # wait protects against nobody, and would hold back a change made there and released.
  - '@canmi/*'
  - '@monoflake/*'
