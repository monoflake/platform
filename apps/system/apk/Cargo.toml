[package]
name = "apk"
version = "0.0.0"
description = "The machine's package updates on Alpine, through a named pipe."
keywords = ["apk", "alpine", "updates"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
jiff = { version = "0.2", features = ["serde"] }
ledger = { path = "../../../libs/ledger" }
libc = "0.2.190"
mimalloc = "0.1.52"
packages = { path = "../../../libs/packages" }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
axum = "0.8.9"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
