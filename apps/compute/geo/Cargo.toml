[package]
name = "geo"
version = "0.0.0"
description = "Place names and IP lookup, as a service."
keywords = ["geocoding", "geoip", "geonames"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
whereabouts = { version = "1.1.0", features = ["coordinates", "ip"] }
response = { version = "2.0.0", features = ["axum"] }
monoflake = { path = "../../../libs/sdk" }
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1.0.104"
mimalloc = "0.1.52"

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.151"
tower = { version = "0.5", features = ["util"] }
