# What host needs to run this service. The record is read by host on the machine, a program
# deployed apart from this file, so it carries a version. See infra's spec/architecture/host.md.
version = 1
name = "geo"
display_name = "IP Geolocation"
placements = ["rdu", "tyo"]

[container]
# The tropics sit at 23.44 degrees; see spec/architecture/services.md, "A service keeps one port".
port = 23440
health = "/health"
# What geo holds itself, 12 MiB measured after a thousand lookups, and room for the index pages
# lookups keep warm; the kernel takes those back first. See spec/architecture/geo.md, "Both
# lookups are files laid out for asking, and the page cache keeps them".
memory_mb = 64

# Where GeoLite2 is fetched to, at run time -- unlike /data, which the image ships read-only. See
# spec/architecture/geo.md, "geo fetches it itself, at run time, once a day".
[data]
path = "/state"

# The `geo` scope of the API host: public through the gateway, which limits it by address, and
# unlimited privately and to our own Workers. See spec/architecture/services.md.
[api]
public = true

# Any page may look an address up, and a place's address changes only when the gazetteer is deployed
# again. See spec/architecture/gateway.md, "The declaration".
[api.defaults.cors]
origins = "public"

[api.defaults.cache.success]
fulfilled = "1d"

# A lookup answers from memory: a minute's worth at once a second keeps a crawler off the machine.
[[api.limits]]
methods = ["GET", "HEAD"]
path = "/address"
count = 60
seconds = 60

[[api.limits]]
methods = ["GET", "HEAD"]
path = "/ip"
count = 60
seconds = 60
