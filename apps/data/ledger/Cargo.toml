[package]
name = "ledger-service"
version = "0.0.0"
description = "A record of every task a service takes on."
keywords = ["ledger", "tasks", "events"]
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
deadpool-postgres = "0.14.2"
jiff = { version = "0.2", features = ["serde"] }
ledger = { path = "../../../libs/ledger" }
mimalloc = "0.1.52"
response = { version = "2.0.0", features = ["axum"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
# The latency proxy the SQL tests reach Postgres through.
tokio = { version = "1.53.2", features = ["io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
